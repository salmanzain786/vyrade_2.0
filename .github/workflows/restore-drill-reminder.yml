name: Restore Drill Reminder

# Milestone 2.9 — schedules the backup/restore drill as a RECURRING exercise
# (quarterly) rather than a one-time checkbox. On schedule it opens a tracking
# issue with the drill checklist, so the exercise is owned and evidenced in the
# repo — not dependent on someone remembering a personal calendar entry.

on:
  schedule:
    # 09:00 UTC on the 1st of Jan, Apr, Jul, Oct (quarterly).
    - cron: '0 9 1 1,4,7,10 *'
  workflow_dispatch: {}   # allow a manual "run the drill now" trigger

permissions:
  issues: write

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Open quarterly restore-drill issue
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              'Recurring **backup + restore drill** (BACKUP_RESTORE_RUNBOOK.md, milestones 2.8/2.9).',
              "A backup you've never restored from is a hope, not a backup — so we prove it every quarter.",
              '',
              '### Run the drill (follow the 2.7 runbook)',
              '- [ ] Spin up a scratch MySQL resource in Coolify.',
              '- [ ] Restore the **latest** Coolify backup from S3 into it.',
              '- [ ] `npm run verify:restore` — row counts + PK maxima vs live.',
              '- [ ] `npm run verify:schema` against the restored DB (app-boot readiness).',
              '- [ ] Boot the app against the restored data; confirm it serves a request.',
              '- [ ] Tear down the scratch resource.',
              '',
              "### Record the evidence (paste here + into the runbook's Drill Log)",
              '- [ ] Backup file (timestamp) restored',
              '- [ ] Wall-clock: S3 download + restore + boot  (vs. RTO = 4h)',
              '- [ ] `verify:restore` output (row-count parity)',
              '- [ ] Row counts before/after',
              '',
              'Close this issue once the evidence is recorded in BACKUP_RESTORE_RUNBOOK.md.',
            ].join('\n');
            const month = new Date().toISOString().slice(0, 7);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Quarterly backup restore drill — ${month}`,
              labels: ['ops'],
              body,
            });
